services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos_dev_password
      POSTGRES_DB: pos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      POS_DATABASE_URL: postgres://pos:pos_dev_password@postgres:5432/pos
      POS_JWT_SECRET: ${POS_JWT_SECRET:-change-me-in-production}
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    image: nginx:alpine
    volumes:
      - ../crates/ui/ui_wasm/dist:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
