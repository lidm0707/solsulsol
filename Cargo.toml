[workspace]
resolver = "2"
members = [
    "crates/backend",
    "crates/api",
    "crates/barcode",
    "crates/qr_code",
    "crates/promptpay",
    "crates/ui/ui_interface",
    "crates/ui/ui_wasm",
    "crates/sol_wallet_adaptor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal", "migrate"] }
uuid = { version = "1", features = ["v4", "v7", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
argon2 = "0.5"
jsonwebtoken = "9"
async-trait = "0.1"
mockall = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dioxus = { version = "0.7", features = ["web"] }
gloo-net = "0.6"
qrcode = { version = "0.14", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }

