[package]
name = "voice-over-demo"
version = "0.2.0"
edition = "2024"
publish = false
description = "Offline English singing-voice synthesizer prototype (formant DSP, pure Rust)"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
ureq = "2"
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
