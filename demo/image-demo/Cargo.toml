[package]
name = "image-demo"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
name = "image_demo"
path = "src/lib.rs"

[dependencies]
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"], optional = true }
usvg = { version = "0.45", optional = true }
resvg = { version = "0.45", optional = true }

[features]
default = []
svg = ["dep:usvg", "dep:resvg"]
serde = ["dep:serde"]

[[example]]
name = "generate"
required-features = []

[[example]]
name = "generate_svg"
required-features = ["svg"]
