<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>solsulsol — Solana POS</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23321e26'/%3E%3Crect x='4' y='4' width='56' height='56' rx='11' fill='none' stroke='%23452a35' stroke-width='2'/%3E%3Cpath d='M14 22l10 8-10 8' fill='none' stroke='%23ffab73' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='30' y='36' width='20' height='5' rx='2.5' fill='%23ff9eb5'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #221418;
        --panel: #321e26;
        --panel-3: #4d2b3a;
        --accent: #ffab73;
        --accent-2: #ff8c5f;
        --pink: #ff9eb5;
        --text: #fff3e9;
        --muted: #c9a8a0;
        --border: #452a35;
        --ink: #3a1d28;
        --shadow: #5c2e3a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      a { color: var(--accent); text-decoration: none; }
      .page {
        min-height: 100vh; max-width: 900px; margin: 0 auto;
        display: flex; flex-direction: column; align-items: center;
        gap: 1.1rem; padding: 2.5rem 1.5rem;
      }
      .logo { font-size: 1.2rem; font-weight: 700; letter-spacing: 4px; color: var(--accent); }
      .logo span { color: var(--pink); }
      h1 { font-size: 2.4rem; line-height: 1.15; text-align: center; }
      h1 em {
        font-style: normal; color: var(--accent);
        text-shadow: 0 2px 0 var(--shadow), 0 0 24px rgba(255, 171, 115, 0.35);
      }
      .tagline { color: var(--muted); font-size: 1.05rem; text-align: center; max-width: 560px; }
      .btn {
        display: inline-block; padding: 0.8rem 1.8rem; border-radius: 14px;
        font-weight: 700; font-size: 1rem; cursor: pointer; border: none;
        background: linear-gradient(145deg, var(--accent), var(--accent-2));
        color: var(--ink); box-shadow: 0 4px 0 #b05a3c;
        transition: transform 0.12s ease;
      }
      .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b05a3c; }
      .grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 0.9rem; width: 100%; margin-top: 1rem;
      }
      .card {
        background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
        padding: 1.1rem;
      }
      .card .icon {
        font-family: ui-monospace, monospace; font-size: 1.1rem; font-weight: 700;
        color: var(--accent); background: var(--panel-3); border: 1px solid var(--border);
        border-radius: 10px; padding: 0.35rem 0.6rem; display: inline-block;
      }
      .card h3 { margin: 0.3rem 0; font-size: 1rem; }
      .card p { color: var(--muted); font-size: 0.88rem; }
      .chain-row { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
      .chip {
        background: var(--panel-3); border: 1px solid var(--border); border-radius: 999px;
        padding: 0.3rem 0.9rem; font-size: 0.75rem; text-transform: uppercase;
        font-weight: 700; color: var(--pink);
      }
      .chip.chain { color: #cdb4f6; }
      footer { color: var(--muted); font-size: 0.8rem; margin-top: 0.5rem; }
      .roadmap { width: 100%; max-width: 900px; margin-top: 1rem; }
      .roadmap-title { font-size: 13px; text-transform: uppercase; letter-spacing: 3px; color: var(--pink); text-align: center; margin-bottom: 0.6rem; }
      .hidden-data { display: none; }
      #city-map {
        position: relative; width: 100%; height: 460px;
        border-radius: 18px; border: 1px solid var(--border);
        background: radial-gradient(120% 90% at 50% 0%, #2b1a22 0%, var(--bg) 70%);
        overflow: hidden;
      }
      #city-map canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      #city-map canvas.dragging { cursor: grabbing; }
      .map-ui {
        position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px;
      }
      .map-ui .row { display: flex; gap: 6px; }
      .map-ui button {
        width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border);
        background: rgba(50, 30, 38, 0.9); color: var(--text); font-size: 15px; font-weight: 700;
        cursor: pointer; backdrop-filter: blur(4px);
      }
      .map-ui button:active { transform: translateY(1px); }
      .coming { display: flex; flex-direction: column; gap: 8px; border-color: var(--pink); margin-top: 0.8rem; }
      @media (max-width: 560px) { #city-map { height: 340px; } }
      .coming-badge { align-self: flex-start; background: linear-gradient(145deg, var(--accent), var(--pink)); color: var(--ink); font-size: 11px; font-weight: 800; letter-spacing: 2px; border-radius: 999px; padding: 4px 10px; }
      .coming-title { font-size: 15px; color: var(--accent); }
      .coming-body { color: var(--muted); font-size: 0.88rem; }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <script>
      (() => {
        "use strict";
        const init = (box) => {
        const stopsData = (document.getElementById("city-map-data").textContent || "")
          .trim().split(";").filter(Boolean).map((r) => r.split("~"));

        const TILE_W = 64, TILE_H = 32, WALL_H = 26, GRID = 9;
        const Z_MIN = 0.55, Z_MAX = 2.4;
        const ROAD_J = 7, ROAD_J2 = 4, ROAD_I = 7, ROAD_I2 = 4;

        const ROUTE = [[0.5, 7.5], [7.5, 7.5], [7.5, 0.5]];
        const STOP_POS = [
          [0.5, 7.5], [2.5, 7.5], [4.5, 7.5], [7.5, 4.5], [7.5, 2.5], [7.5, 0.5],
        ];
        const STATE_COLORS = { done: "#9fe6c8", now: "#ffab73", next: "#cdb4f6" };
        const ROUTE_COLOR = "#ffab73";

        const mulberry32 = (a) => () => {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const rand = mulberry32(20260509);

        const BUILDING_COLORS = ["#46293b", "#3d2434", "#4a2b35", "#402840", "#35222e"];
        const cells = [];
        for (let i = 0; i < GRID; i++) {
          for (let j = 0; j < GRID; j++) {
            const road = i === ROAD_I || i === ROAD_I2 || j === ROAD_J || j === ROAD_J2;
            const r = rand();
            if (road) cells.push({ i, j, type: "road" });
            else if (r < 0.18) cells.push({ i, j, type: "tree", s: 0.7 + rand() * 0.5 });
            else if (r < 0.3) cells.push({ i, j, type: "plaza" });
            else cells.push({
              i, j, type: "building",
              h: 22 + rand() * 58, inset: 0.12 + rand() * 0.16,
              c: BUILDING_COLORS[(rand() * BUILDING_COLORS.length) | 0],
            });
          }
        }
        const isRoad = (i, j) => i === ROAD_I || i === ROAD_I2 || j === ROAD_J || j === ROAD_J2;

        const canvas = document.createElement("canvas");
        box.insertBefore(canvas, box.firstChild);
        const ctx = canvas.getContext("2d");
        const cam = { x: 0, y: 0, z: 1 };

        const proj = (x, y, z = 0) => ({
          sx: cam.x + (x - y) * (TILE_W / 2) * cam.z,
          sy: cam.y + (x + y) * (TILE_H / 2) * cam.z - z * cam.z,
        });
        const diamond = (x, y, inset = 0, z = 0) => {
          const p = [
            proj(x + inset, y + inset, z), proj(x + 1 - inset, y + inset, z),
            proj(x + 1 - inset, y + 1 - inset, z), proj(x + inset, y + 1 - inset, z),
          ];
          ctx.beginPath();
          ctx.moveTo(p[0].sx, p[0].sy);
          for (let k = 1; k < 4; k++) ctx.lineTo(p[k].sx, p[k].sy);
          ctx.closePath();
          return p;
        };

        const resize = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = box.clientWidth * dpr;
          canvas.height = box.clientHeight * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          fit();
        };
        const fit = () => {
          const w = (GRID - 1) * TILE_W + 40;
          const h = (GRID - 1) * TILE_H + 120;
          cam.z = Math.max(Z_MIN, Math.min(Z_MAX, Math.min(
            (box.clientWidth - 16) / w, (box.clientHeight - 16) / h,
          )));
          cam.x = box.clientWidth / 2;
          cam.y = box.clientHeight / 2 - ((GRID - 1) * TILE_H) / 2 * cam.z + 30 * cam.z;
        };

        let pointers = new Map();
        let lastPinch = 0;
        canvas.addEventListener("pointerdown", (e) => {
          canvas.setPointerCapture(e.pointerId);
          pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
          canvas.classList.add("dragging");
        });
        canvas.addEventListener("pointermove", (e) => {
          if (!pointers.has(e.pointerId)) return;
          if (pointers.size === 1) {
            const p = pointers.get(e.pointerId);
            cam.x += e.offsetX - p.x;
            cam.y += e.offsetY - p.y;
            pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
          } else if (pointers.size === 2) {
            pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
            const [a, b] = [...pointers.values()];
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            if (lastPinch > 0) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / lastPinch);
            lastPinch = d;
          }
        });
        const release = (e) => {
          pointers.delete(e.pointerId);
          lastPinch = 0;
          if (pointers.size === 0) canvas.classList.remove("dragging");
        };
        canvas.addEventListener("pointerup", release);
        canvas.addEventListener("pointercancel", release);
        canvas.addEventListener("wheel", (e) => {
          e.preventDefault();
          zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * 0.0012));
        }, { passive: false });
        const zoomAt = (px, py, f) => {
          const nz = Math.max(Z_MIN, Math.min(Z_MAX, cam.z * f));
          const k = nz / cam.z;
          cam.x = px - (px - cam.x) * k;
          cam.y = py - (py - cam.y) * k;
          cam.z = nz;
        };
        document.getElementById("zoom-in").onclick = () => zoomAt(box.clientWidth / 2, box.clientHeight / 2, 1.25);
        document.getElementById("zoom-out").onclick = () => zoomAt(box.clientWidth / 2, box.clientHeight / 2, 0.8);
        document.getElementById("zoom-reset").onclick = () => { resize(); };

        const routeColor = () => ROUTE_COLOR;
        const routePts = () => ROUTE.map(([x, y]) => proj(x, y, 6));

        const drawCell = (c) => {
          if (c.type === "road") {
            diamond(c.i, c.j);
            ctx.fillStyle = "#2b1b24";
            ctx.fill();
            diamond(c.i, c.j, 0.12);
            ctx.fillStyle = "#191016";
            ctx.fill();
            return;
          }
          diamond(c.i, c.j);
          ctx.fillStyle = c.type === "plaza" ? "#3a2330" : c.type === "tree" ? "#241820" : "#2a1a22";
          ctx.fill();
          if (c.i === GRID - 1 || c.j === GRID - 1) {
            const p4 = diamond(c.i, c.j);
            const z = WALL_H * cam.z;
            if (c.i === GRID - 1) {
              ctx.beginPath();
              ctx.moveTo(p4[1].sx, p4[1].sy); ctx.lineTo(p4[2].sx, p4[2].sy);
              ctx.lineTo(p4[2].sx, p4[2].sy + z); ctx.lineTo(p4[1].sx, p4[1].sy + z);
              ctx.closePath(); ctx.fillStyle = "#1a1016"; ctx.fill();
            }
            if (c.j === GRID - 1) {
              ctx.beginPath();
              ctx.moveTo(p4[3].sx, p4[3].sy); ctx.lineTo(p4[2].sx, p4[2].sy);
              ctx.lineTo(p4[2].sx, p4[2].sy + z); ctx.lineTo(p4[3].sx, p4[3].sy + z);
              ctx.closePath(); ctx.fillStyle = "#150c11"; ctx.fill();
            }
          }
        };

        const drawBuilding = (c) => {
          ctx.fillStyle = "rgba(0,0,0,0.3)";
          diamond(c.i, c.j, c.inset * 0.8);
          ctx.fill();
          const b = diamond(c.i, c.j, c.inset);
          const h = c.h * cam.z;
          const shade = (hex, f) => {
            const n = parseInt(hex.slice(1), 16);
            const r = Math.min(255, ((n >> 16) & 255) * f) | 0;
            const g = Math.min(255, ((n >> 8) & 255) * f) | 0;
            const b2 = Math.min(255, (n & 255) * f) | 0;
            return `rgb(${r},${g},${b2})`;
          };
          const face = (a, bb) => {
            ctx.beginPath();
            ctx.moveTo(a[0].sx, a[0].sy); ctx.lineTo(bb[0].sx, bb[0].sy);
            ctx.lineTo(bb[0].sx, bb[0].sy - h); ctx.lineTo(a[0].sx, a[0].sy - h);
            ctx.closePath(); ctx.fill();
          };
          ctx.fillStyle = shade(c.c, 0.55);
          face([b[3]], [b[2]]);
          ctx.fillStyle = shade(c.c, 0.8);
          face([b[1]], [b[2]]);
          ctx.fillStyle = shade(c.c, 1.25);
          diamond(c.i, c.j, c.inset, c.h);
          ctx.fill();
          ctx.strokeStyle = "rgba(0,0,0,0.35)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(b[0].sx, b[0].sy); ctx.lineTo(b[1].sx, b[1].sy);
          ctx.lineTo(b[2].sx, b[2].sy); ctx.lineTo(b[3].sx, b[3].sy);
          ctx.closePath(); ctx.stroke();
        };

        const drawTree = (c) => {
          const cx = proj(c.i + 0.5, c.j + 0.5);
          const s = c.s;
          const trunkH = 8 * s * cam.z, canopy = 16 * s * cam.z;
          ctx.strokeStyle = "#4a2b20";
          ctx.lineWidth = 3 * s * cam.z;
          ctx.beginPath();
          ctx.moveTo(cx.sx, cx.sy);
          ctx.lineTo(cx.sx, cx.sy - trunkH);
          ctx.stroke();
          for (let k = 0; k < 2; k++) {
            const base = trunkH + k * canopy * 0.55;
            const r = canopy * (1 - k * 0.35);
            ctx.beginPath();
            ctx.moveTo(cx.sx - r, cx.sy - base - r * 0.5);
            ctx.lineTo(cx.sx + r, cx.sy - base - r * 0.5);
            ctx.lineTo(cx.sx, cx.sy - base - r * 1.6);
            ctx.closePath();
            ctx.fillStyle = k === 0 ? "#2f4a3a" : "#3a5a46";
            ctx.fill();
          }
        };

        const drawLanes = () => {
          ctx.strokeStyle = "rgba(255,158,181,0.35)";
          ctx.lineWidth = 1.4 * cam.z;
          ctx.setLineDash([6 * cam.z, 8 * cam.z]);
          const line = (a, b) => {
            const p1 = proj(a[0], a[1]), p2 = proj(b[0], b[1]);
            ctx.beginPath(); ctx.moveTo(p1.sx, p1.sy); ctx.lineTo(p2.sx, p2.sy); ctx.stroke();
          };
          line([0.5, ROAD_J + 0.5], [GRID - 0.5, ROAD_J + 0.5]);
          line([0.5, ROAD_J2 + 0.5], [GRID - 0.5, ROAD_J2 + 0.5]);
          line([ROAD_I + 0.5, 0.5], [ROAD_I + 0.5, GRID - 0.5]);
          line([ROAD_I2 + 0.5, 0.5], [ROAD_I2 + 0.5, GRID - 0.5]);
          ctx.setLineDash([]);
        };

        const drawRoute = (t) => {
          const pts = routePts();
          const col = routeColor();
          ctx.lineJoin = "round"; ctx.lineCap = "round";
          ctx.strokeStyle = col;
          ctx.globalAlpha = 0.22;
          ctx.lineWidth = 11 * cam.z;
          ctx.strokePoly(pts);
          ctx.globalAlpha = 1;
          ctx.lineWidth = 4 * cam.z;
          ctx.strokePoly(pts);
          ctx.strokeStyle = "rgba(255,243,233,0.9)";
          ctx.lineWidth = 1.6 * cam.z;
          ctx.setLineDash([9, 11]);
          ctx.lineDashOffset = -t * 0.04;
          ctx.strokePoly(pts);
          ctx.setLineDash([]);

          let total = 0;
          const segs = [];
          for (let k = 1; k < pts.length; k++) {
            const d = Math.hypot(pts[k].sx - pts[k - 1].sx, pts[k].sy - pts[k - 1].sy);
            segs.push(d); total += d;
          }
          let dist = (t * 0.09) % total;
          for (let k = 0; k < segs.length; k++) {
            if (dist > segs[k]) { dist -= segs[k]; continue; }
            const f = dist / segs[k];
            const x = pts[k].sx + (pts[k + 1].sx - pts[k].sx) * f;
            const y = pts[k].sy + (pts[k + 1].sy - pts[k].sy) * f;
            ctx.beginPath();
            ctx.arc(x, y, 4.5 * cam.z, 0, Math.PI * 2);
            ctx.fillStyle = "#fff3e9";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x, y, 8 * cam.z, 0, Math.PI * 2);
            ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
            break;
          }
          for (let k = 1; k < pts.length; k++) {
            const a = pts[k - 1], b = pts[k];
            for (const f of [0.38, 0.72]) {
              const x = a.sx + (b.sx - a.sx) * f, y = a.sy + (b.sy - a.sy) * f;
              const ang = Math.atan2(b.sy - a.sy, b.sx - a.sx);
              const s = 5.5 * cam.z;
              ctx.save();
              ctx.translate(x, y); ctx.rotate(ang);
              ctx.beginPath();
              ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, -s * 0.7); ctx.lineTo(-s * 0.7, s * 0.7);
              ctx.closePath();
              ctx.fillStyle = col; ctx.fill();
              ctx.restore();
            }
          }
        };

        const drawLabel = (x, y, title, sub, border, big) => {
          ctx.font = big ? "700 12px system-ui" : "700 11px system-ui";
          const w1 = ctx.measureText(title).width;
          ctx.font = "400 9px system-ui";
          const w2 = sub ? ctx.measureText(sub).width : 0;
          const pw = Math.max(w1, w2) + 18, ph = sub ? 30 : 18;
          const px = x - pw / 2, py = y - ph;
          ctx.strokeStyle = border;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x, y + 12); ctx.stroke();
          ctx.fillStyle = "rgba(22,12,18,0.94)";
          ctx.strokeStyle = border;
          ctx.beginPath();
          ctx.roundRect(px, py, pw, ph, 7);
          ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#fff3e9";
          ctx.font = big ? "700 12px system-ui" : "700 11px system-ui";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(title, x, py + (sub ? 9 : ph / 2));
          if (sub) {
            ctx.fillStyle = "#c9a8a0";
            ctx.font = "400 9px system-ui";
            ctx.fillText(sub, x, py + 21);
          }
        };

        const drawStops = (t) => {
          const label = (k) => stopsData[k] || ["", "", ""];
          const startP = proj(STOP_POS[0][0], STOP_POS[0][1], 2);
          const pulse = 6 + Math.sin(t * 0.004) * 3;
          ctx.beginPath();
          ctx.arc(startP.sx, startP.sy, (10 + pulse) * cam.z, 0, Math.PI * 2);
          ctx.strokeStyle = STATE_COLORS.done; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.beginPath();
          ctx.arc(startP.sx, startP.sy, 5 * cam.z, 0, Math.PI * 2);
          ctx.fillStyle = STATE_COLORS.done; ctx.fill();
          drawLabel(startP.sx, startP.sy - 14 * cam.z, "START", "", STATE_COLORS.done, false);

          for (let k = 0; k < stopsData.length; k++) {
            const [title, sub, state] = label(k);
            const goal = k === stopsData.length - 1;
            const pos = STOP_POS[k + 1];
            const p = proj(pos[0], pos[1], 2);
            const col = goal ? "#ff9eb5" : STATE_COLORS[state] || "#ffab73";
            const headY = p.sy - 30 * cam.z;
            ctx.beginPath();
            ctx.ellipse(p.sx, p.sy, 6 * cam.z, 3 * cam.z, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fill();
            ctx.beginPath();
            ctx.moveTo(p.sx, p.sy); ctx.lineTo(p.sx, headY);
            ctx.strokeStyle = "rgba(255,243,233,0.5)"; ctx.lineWidth = 1.5; ctx.stroke();
            if (goal) {
              const wave = Math.sin(t * 0.005) * 3;
              ctx.strokeStyle = "#fff3e9"; ctx.lineWidth = 2;
              ctx.beginPath(); ctx.moveTo(p.sx, headY); ctx.lineTo(p.sx, headY - 16 * cam.z); ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(p.sx, headY - 16 * cam.z);
              ctx.lineTo(p.sx + 15 * cam.z + wave, headY - 11 * cam.z);
              ctx.lineTo(p.sx, headY - 6 * cam.z);
              ctx.closePath();
              ctx.fillStyle = col; ctx.fill();
              ctx.beginPath();
              ctx.arc(p.sx, headY, (12 + Math.sin(t * 0.004) * 3) * cam.z, 0, Math.PI * 2);
              ctx.strokeStyle = col; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5; ctx.stroke();
              ctx.globalAlpha = 1;
              drawLabel(p.sx, headY - 20 * cam.z, "GOAL \u00b7 " + title, sub, col, true);
            } else {
              ctx.beginPath();
              ctx.arc(p.sx, headY, 6.5 * cam.z, 0, Math.PI * 2);
              ctx.fillStyle = col; ctx.fill();
              ctx.beginPath();
              ctx.arc(p.sx, headY, 9.5 * cam.z, 0, Math.PI * 2);
              ctx.strokeStyle = "rgba(255,243,233,0.6)"; ctx.lineWidth = 1.5; ctx.stroke();
              drawLabel(p.sx, headY - 14 * cam.z, title, sub, col, false);
            }
          }
        };

        CanvasRenderingContext2D.prototype.strokePoly = function (pts) {
          if (pts.length < 2) return;
          this.beginPath();
          this.moveTo(pts[0].sx, pts[0].sy);
          for (let k = 1; k < pts.length; k++) this.lineTo(pts[k].sx, pts[k].sy);
          this.stroke();
        };

        const frame = (t) => {
          ctx.clearRect(0, 0, box.clientWidth, box.clientHeight);
          const sorted = [...cells].sort((a, b) => a.i + a.j - (b.i + b.j));
          for (const c of sorted) drawCell(c);
          drawLanes();
          for (const c of sorted) {
            if (c.type === "building") drawBuilding(c);
            else if (c.type === "tree") drawTree(c);
          }
          drawRoute(t);
          drawStops(t);
          requestAnimationFrame(frame);
        };

        window.addEventListener("resize", resize);
        resize();
        requestAnimationFrame(frame);
        };
        const tryInit = () => {
          const box = document.getElementById("city-map");
          if (box) { init(box); return true; }
          return false;
        };
        if (!tryInit()) {
          const obs = new MutationObserver((_m, o) => {
            if (tryInit()) o.disconnect();
          });
          obs.observe(document.body, { childList: true, subtree: true });
        }
      })();
    </script>
  </body>
</html>
