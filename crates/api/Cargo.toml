axum = ["dep:axum"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
thiserror.workspace = true
axum = { version = "0.8", optional = true, default-features = false, features = ["json"] }
